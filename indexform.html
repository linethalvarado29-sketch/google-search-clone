<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Search Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="top-nav">
        <a href="search-images.html">Images</a>
        <a href="advanced-search.html">Advanced Search</a>
    </nav>

    <main class="search-container">
        <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_272x92dp.png" alt="Google Logo" class="google-logo">
        
        <form action="https://google.com/search" method="GET" class="search-form">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" name="q" class="search-input">
            </div>
            <div class="button-container">
                <input type="submit" value="Google Search" class="btn">
                <input type="submit" name="btnI" value="I'm Feeling Lucky" class="btn">
            </div>
        </form>
    </main>
</body>
</html>
