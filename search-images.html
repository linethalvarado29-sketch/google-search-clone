<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Images Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="top-nav">
        <a href="index.html">Google Search</a>
    </nav>

    <main class="search-container">
        <div class="logo-container">
            <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_272x92dp.png" alt="Google Logo" class="google-logo">
            <span class="sub-label">images</span>
        </div>
        
        <form action="https://google.com/search" method="GET" class="search-form">
            <input type="hidden" name="tbm" value="isch">
            
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" name="q" class="search-input">
            </div>
            <div class="button-container">
                <input type="submit" value="Search Images" class="btn">
            </div>
        </form>
    </main>
</body>
</html>
